services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - AGENT_API_KEY=${AGENT_API_KEY:-dev-key-change-in-production}
      - VECTOR_STORE_TYPE=${VECTOR_STORE_TYPE:-qdrant}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEMORY_TYPE=${MEMORY_TYPE:-redis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - H2_CONSOLE=false
    depends_on:
      - qdrant
      - redis
    networks:
      - agent-network
    restart: unless-stopped

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent-network
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - agent-network
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:

networks:
  agent-network:
    driver: bridge