server:
  port: 8080

spring:
  application:
    name: ai-agent

  # H2 Database (development)
  datasource:
    url: jdbc:h2:mem:agentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/v1
      chat:
        model: deepseek-v4-pro
        options:
          temperature: 0.7
          max-tokens: 4096
        # Streaming support
        completions-path: /chat/completions
      embedding:
        options:
          model: text-embedding-3-small

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Custom configuration
agent:
  name: AI Agent
  version: 0.0.1
  default-model: ${DEFAULT_MODEL:deepseek-v4-pro}
  fast-model: ${FAST_MODEL:deepseek-v4-flash}
  max-iterations: 10
  timeout-seconds: 60

logging:
  level:
    com.baiyu.agent: DEBUG
    org.springframework.ai: DEBUG
