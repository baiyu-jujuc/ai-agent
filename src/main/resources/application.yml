server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-http-form-post-size: 20KB
    max-swallow-size: 20KB

spring:
  application:
    name: ai-agent

  # H2 Database (development)
  datasource:
    url: jdbc:h2:mem:agentdb
    driver-class-name: org.h2.Driver
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

  # Redis (Phase 3: chat memory + cache, only used when MEMORY_TYPE=redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
          max-wait: 2000ms

  # Spring AI Configuration
  ai:
    # OpenAI-compatible (DeepSeek) chat model
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        options:
          temperature: 0.7
          max-tokens: 4096
        completions-path: /chat/completions
      embedding:
        enabled: false

    # ONNX local embedding model (DeepSeek API doesn't support embeddings)
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: ${ONNX_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/model.onnx}
        tokenizer:
          uri: ${ONNX_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}
          options:
            padding: "true"
        cache:
          enabled: true
          directory: ${ONNX_CACHE_DIR:./onnx-cache}

    # Qdrant Vector Store (Phase 3: production vector store)
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6333}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:ai-agent-docs}
        use-tls: false
        initialize-schema: ${QDRANT_INIT_SCHEMA:false}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
    qdrant:
      enabled: false

# Custom configuration
agent:
  name: AI Agent
  version: 0.0.1
  default-model: ${DEFAULT_MODEL:deepseek-v4-flash}
  pro-model: ${PRO_MODEL:deepseek-v4-pro}
  fast-model: ${FAST_MODEL:deepseek-v4-flash}
  vision-model: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
  max-iterations: 10
  timeout-seconds: 60
  # P0 Security: API key auth + file sandbox + CORS + rate limit
  security:
    api-key: ${AGENT_API_KEY:dev-key-change-in-production}
    file-access-dir: ${FILE_ACCESS_DIR:./workspace}
    protected-paths: /api/**
    rate-limit-per-minute: ${RATE_LIMIT:30}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080}
  # Memory: token budget management
  memory:
    max-tokens: 8000
    max-messages: 40
    max-conversations: ${MAX_CONVERSATIONS:100}
  # Phase 3: Storage backend selection
  storage:
    vector-store: ${VECTOR_STORE_TYPE:memory}
    memory: ${MEMORY_TYPE:memory}

logging:
  level:
    com.baiyu.agent: DEBUG
    org.springframework.ai: DEBUG
