server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: ${SERVER_CONTEXT_PATH:/}

  tomcat:
    uri-encoding: UTF-8
    max-http-form-post-size: 20KB
    max-swallow-size: 20KB

spring:
  application:
    name: ai-agent

  # B2: Allow file uploads up to 10MB (matches RagService.MAX_FILE_SIZE)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # QdrantVectorStore is created explicitly in VectorStoreConfig for qdrant mode.
  # The starter auto-config is excluded by default (memory mode) so memory mode never requires an EmbeddingModel.
  # In qdrant mode, the auto-config is NOT excluded — it provides the QdrantClient bean.
  autoconfigure:
    exclude:
      ${AUTOCONFIG_EXCLUDE:org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration}

  # IntelliJ/local runs use a persistent file-based H2 database by default.
  # Docker Compose overrides these values with SPRING_DATASOURCE_* and uses MySQL.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agentdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${H2_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${H2_PASSWORD:}}
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # Redis (Phase 3: chat memory + cache, only used when MEMORY_TYPE=redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
          max-wait: 2000ms

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        model: ${DEFAULT_MODEL:deepseek-v4-flash}
        options:
          temperature: 0.7
          max-tokens: 4096
        completions-path: /chat/completions
      # B1: Embedding config for Qdrant mode.
      # DeepSeek does not provide embeddings; use a separate OpenAI-compatible provider.
      # Only needed when VECTOR_STORE_TYPE=qdrant.
      embedding:
        api-key: ${EMBEDDING_API_KEY:${DEEPSEEK_API_KEY:}}
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}

    # Qdrant Vector Store (Phase 3: production vector store)
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        # 注意：6333 是 REST，6334 是 gRPC；Spring AI 的 QdrantVectorStore 走 gRPC 客户端，
        # 所以这里必须是 gRPC 端口（填 6333 会报 UNAVAILABLE: io exception）
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:kb_chunks}
        use-tls: false
        initialize-schema: ${QDRANT_INIT_SCHEMA:false}

# B8: Actuator — restrict details, minimize exposure
management:
  endpoints:
    web:
      exposure:
        # 升级后新增 metrics / prometheus：L4 用它验证自定义指标（llm_call_total 等）
        include: ${MANAGEMENT_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
    qdrant:
      enabled: false

# Custom configuration
agent:
  name: AI Agent
  version: 0.0.1
  default-model: ${DEFAULT_MODEL:deepseek-v4-flash}
  pro-model: ${PRO_MODEL:deepseek-v4-pro}
  fast-model: ${FAST_MODEL:deepseek-v4-flash}
  vision-model: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
  max-iterations: 10
  timeout-seconds: 60
  # P0 Security: API key auth + file sandbox + rate limit + CORS
  security:
    api-key: ${AGENT_API_KEY:dev-key-change-in-production}
    file-access-dir: ${FILE_ACCESS_DIR:./workspace}
    # 受保护路径（默认全部 API，含 chat/tools/rag）
    protected-paths: /api/**
    # 公开只读接口（仅 GET 生效）
    public-paths: /api/chat/models,/api/chat/tools,/api/chat/storage-status,/api/agent/**
    # 单客户端每分钟请求上限，超出返回 429
    rate-limit-per-minute: ${RATE_LIMIT:30}
    # CORS 允许来源
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080}
    # T3: 允许客户端传递模型 API Key（默认关闭，仅私有部署可开启）
    # 开启后，服务端读取 X-Model-API-Key 请求头，仅用于当前请求的 LLM 调用
    # Key 不进入日志、数据库、URL、异常响应，请求结束后不保留
    allow-client-model-key: ${ALLOW_CLIENT_MODEL_KEY:false}
    # JWT 密钥（生产环境必须修改）
    jwt-secret: ${JWT_SECRET:default-jwt-secret-change-in-production-at-least-32-chars}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # 管理接口（/api/admin/**）需要 ADMIN 角色。两种获得方式：
    #   1) admin-usernames：名单里的用户名注册后即为 admin（默认空，避免"谁先注册谁管理员"）
    #   2) bootstrap-admin-username / -password：启动时创建引导管理员（已存在则不自动提权）
    admin-usernames: ${ADMIN_USERNAMES:}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # 对话记忆预算：超出后裁剪最早的消息 / 淘汰最久未用的会话
  memory:
    max-tokens: ${MEMORY_MAX_TOKENS:8000}
    max-messages: ${MEMORY_MAX_MESSAGES:40}
    max-conversations: ${MAX_CONVERSATIONS:100}
  # Phase 3: Storage backend selection
  storage:
    # vector-store: memory (dev, no Docker) | qdrant (prod, needs Docker)
    vector-store: ${VECTOR_STORE_TYPE:memory}
    # memory: memory (dev, no Docker) | redis (prod, needs Docker)
    memory: ${MEMORY_TYPE:memory}

  # 模型调用网关：L1 计量 / L2 稳定性 / L3 缓存与 Prompt 治理 / L4 指标
  # 每一层都有独立开关；出问题时按开关逐个排除，不要一次全开再 debug。
  gateway:
    enabled: ${GATEWAY_ENABLED:true}
    # L1：写用量记录（关闭后只是不记账，主链路行为不变）
    metering-enabled: ${GATEWAY_METERING_ENABLED:true}
    # L2：限流/熔断/重试（默认关闭：先让计量跑对，再开稳定性）
    resilience-enabled: ${GATEWAY_RESILIENCE_ENABLED:false}
    # L4：Micrometer 指标
    metrics-enabled: ${GATEWAY_METRICS_ENABLED:true}
    # L3：Prompt 模板走数据库版本管理（关闭后回退到代码里的内置模板）
    prompt-store-enabled: ${GATEWAY_PROMPT_STORE_ENABLED:true}
    # 网关层超时：必须明显小于 AiConfig 里 HTTP 层的 60s，否则 HTTP 层先超时，熔断统计不到失败
    timeout-seconds: ${GATEWAY_TIMEOUT_SECONDS:30}
    rate-limit-per-model-per-second: ${GATEWAY_RATE_LIMIT_PER_MODEL_PER_SECOND:5}
    retry-max-attempts: ${GATEWAY_RETRY_MAX_ATTEMPTS:2}
    cache:
      # 语义缓存需要 EmbeddingModel（仅 VECTOR_STORE_TYPE=qdrant 时存在）；
      # memory 模式下即使这里是 true，缓存 Bean 也不存在，网关照常工作，只是不命中。
      enabled: ${GATEWAY_CACHE_ENABLED:true}
      similarity-threshold: ${GATEWAY_CACHE_THRESHOLD:0.92}
      ttl-hours: ${GATEWAY_CACHE_TTL_HOURS:24}
      collection: ${GATEWAY_CACHE_COLLECTION:semantic_cache}
    # 路由：主模型 + 逗号分隔的降级链（L2 熔断/失败后按顺序降级）
    routes:
      kb_qa:
        primary: ${PRO_MODEL:deepseek-v4-pro}
        fallbacks: ${FAST_MODEL:deepseek-v4-flash}
      default_chat:
        primary: ${DEFAULT_MODEL:deepseek-v4-flash}
        fallbacks: ""
    # 单价表：单位是「微元 / 百万 token」，即 元/百万token × 1_000_000。
    # ！！！下面两个是 DeepSeek 公开挂牌价的换算示例，不是账单实测值 ！！！
    # 请在收尾前按自己的实际计费口径核对并改写；单价会作为快照写进每条用量记录。
    pricing:
      models:
        deepseek-chat:
          prompt-per-million: ${PRICE_DEEPSEEK_CHAT_PROMPT:2000000}
          completion-per-million: ${PRICE_DEEPSEEK_CHAT_COMPLETION:8000000}
        deepseek-reasoner:
          prompt-per-million: ${PRICE_DEEPSEEK_REASONER_PROMPT:4000000}
          completion-per-million: ${PRICE_DEEPSEEK_REASONER_COMPLETION:16000000}

logging:
  level:
    com.baiyu.agent: ${LOG_LEVEL:INFO}
    org.springframework.ai: ${AI_LOG_LEVEL:INFO}

# Legacy RAG endpoints (/api/rag/**) — disabled by default in production.
# Enable only for local debugging; these endpoints bypass knowledge space isolation.
legacy:
  rag:
    enabled: ${LEGACY_RAG_ENABLED:false}
