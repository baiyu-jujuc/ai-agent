server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: ${SERVER_CONTEXT_PATH:/}

  tomcat:
    uri-encoding: UTF-8
    max-http-form-post-size: 20KB
    max-swallow-size: 20KB

spring:
  application:
    name: ai-agent

  # B2: Allow file uploads up to 10MB (matches RagService.MAX_FILE_SIZE)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Qdrant VectorStore is created explicitly in VectorStoreConfig.
  # The starter auto-config is always excluded so memory mode never requires an EmbeddingModel.
  autoconfigure:
    exclude:
      org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration

  # H2 Database (development)
  datasource:
    url: jdbc:h2:mem:agentdb
    driver-class-name: org.h2.Driver
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # Redis (Phase 3: chat memory + cache, only used when MEMORY_TYPE=redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
          max-wait: 2000ms

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        model: ${DEFAULT_MODEL:deepseek-v4-flash}
        options:
          temperature: 0.7
          max-tokens: 4096
        completions-path: /chat/completions
      # B1: Embedding config for Qdrant mode.
      # DeepSeek does not provide embeddings; use a separate OpenAI-compatible provider.
      # Only needed when VECTOR_STORE_TYPE=qdrant.
      embedding:
        api-key: ${EMBEDDING_API_KEY:${DEEPSEEK_API_KEY:}}
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}

    # Qdrant Vector Store (Phase 3: production vector store)
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6333}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:kb_chunks}
        use-tls: false
        initialize-schema: ${QDRANT_INIT_SCHEMA:false}

# B8: Actuator — restrict details, minimize exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
    qdrant:
      enabled: false

# Custom configuration
agent:
  name: AI Agent
  version: 0.0.1
  default-model: ${DEFAULT_MODEL:deepseek-v4-flash}
  pro-model: ${PRO_MODEL:deepseek-v4-pro}
  fast-model: ${FAST_MODEL:deepseek-v4-flash}
  vision-model: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
  max-iterations: 10
  timeout-seconds: 60
  # P0 Security: API key auth + file sandbox + rate limit + CORS
  security:
    api-key: ${AGENT_API_KEY:dev-key-change-in-production}
    file-access-dir: ${FILE_ACCESS_DIR:./workspace}
    # 受保护路径（默认全部 API，含 chat/tools/rag）
    protected-paths: /api/**
    # 公开只读接口（仅 GET 生效）
    public-paths: /api/chat/models,/api/chat/tools,/api/chat/storage-status,/api/agent/**
    # 单客户端每分钟请求上限，超出返回 429
    rate-limit-per-minute: ${RATE_LIMIT:30}
    # CORS 允许来源
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080}
    # T3: 允许客户端传递模型 API Key（默认关闭，仅私有部署可开启）
    # 开启后，服务端读取 X-Model-API-Key 请求头，仅用于当前请求的 LLM 调用
    # Key 不进入日志、数据库、URL、异常响应，请求结束后不保留
    allow-client-model-key: ${ALLOW_CLIENT_MODEL_KEY:false}
    # JWT 密钥（生产环境必须修改）
    jwt-secret: ${JWT_SECRET:default-jwt-secret-change-in-production-at-least-32-chars}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # 对话记忆预算：超出后裁剪最早的消息 / 淘汰最久未用的会话
  memory:
    max-tokens: ${MEMORY_MAX_TOKENS:8000}
    max-messages: ${MEMORY_MAX_MESSAGES:40}
    max-conversations: ${MAX_CONVERSATIONS:100}
  # Phase 3: Storage backend selection
  storage:
    # vector-store: memory (dev, no Docker) | qdrant (prod, needs Docker)
    vector-store: ${VECTOR_STORE_TYPE:memory}
    # memory: memory (dev, no Docker) | redis (prod, needs Docker)
    memory: ${MEMORY_TYPE:memory}

logging:
  level:
    com.baiyu.agent: ${LOG_LEVEL:INFO}
    org.springframework.ai: ${AI_LOG_LEVEL:INFO}
