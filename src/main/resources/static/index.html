<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; }
        
        .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; }
        .sidebar-header h1 { font-size: 1.2em; color: #58a6ff; margin-bottom: 4px; }
        .sidebar-header .badge { background: rgba(63,185,80,0.15); color: #3fb950; padding: 2px 10px; border-radius: 12px; font-size: 0.75em; }
        
        .sidebar-section { padding: 12px 16px; border-bottom: 1px solid #21262d; }
        .sidebar-section h2 { font-size: 0.8em; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        .agent-list { display: flex; flex-direction: column; gap: 4px; }
        .agent-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9em; transition: background 0.2s; }
        .agent-item:hover { background: #21262d; }
        .agent-item.active { background: #1f6feb33; border: 1px solid #1f6feb; }
        .agent-item .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
        
        .tool-list { display: flex; flex-direction: column; gap: 4px; }
        .tool-item { padding: 6px 12px; font-size: 0.85em; color: #8b949e; display: flex; justify-content: space-between; }
        .tool-item .name { color: #d2a8ff; }
        
        .upload-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; width: 100%; text-align: center; transition: background 0.2s; }
        .upload-btn:hover { background: #30363d; }
        
        .main { flex: 1; display: flex; flex-direction: column; }
        .main-header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .main-header .title { font-size: 1em; color: #e6edf3; }
        .main-header .conv-id { font-size: 0.8em; color: #8b949e; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .message { margin-bottom: 16px; max-width: 80%; }
        .message.user { margin-left: auto; }
        .message .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .message.user .bubble { background: #1f6feb; }
        .message.assistant .bubble { background: #161b22; border: 1px solid #30363d; }
        .message.assistant .bubble pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto; }
        .message.assistant .bubble code { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.9em; }
        .message.assistant .bubble.streaming::after { content: '▊'; animation: blink 1s infinite; }
        @keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
        
        .input-area { background: #161b22; border-top: 1px solid #30363d; padding: 16px 24px; display: flex; gap: 12px; align-items: center; }
        .input-area input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; color: #e6edf3; font-size: 1em; outline: none; }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button { background: #1f6feb; color: white; border: none; border-radius: 8px; padding: 12px 24px; cursor: pointer; font-size: 1em; }
        .input-area button:hover { background: #388bfd; }
        .input-area button:disabled { background: #21262d; cursor: not-allowed; }
        .input-area .clear-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AI Agent</h1>
            <span class="badge">DeepSeek V4 Pro</span>
        </div>
        
        <div class="sidebar-section">
            <h2>Agents</h2>
            <div class="agent-list" id="agentList">
                <div class="agent-item active" data-agent="coordinator">
                    <span class="dot"></span> Coordinator
                </div>
                <div class="agent-item" data-agent="code">
                    <span class="dot"></span> Code Agent
                </div>
                <div class="agent-item" data-agent="research">
                    <span class="dot"></span> Research
                </div>
                <div class="agent-item" data-agent="data">
                    <span class="dot"></span> Data Agent
                </div>
                <div class="agent-item" data-agent="react">
                    <span class="dot"></span> ReAct Agent
                </div>
            </div>
        </div>
        
        <div class="sidebar-section">
            <h2>Tools</h2>
            <div class="tool-list" id="toolList">
                <div class="tool-item"><span class="name">calculator</span><span>Math</span></div>
                <div class="tool-item"><span class="name">time</span><span>Info</span></div>
                <div class="tool-item"><span class="name">systeminfo</span><span>Info</span></div>
            </div>
        </div>
        
        <div class="sidebar-section">
            <h2>Knowledge Base</h2>
            <label class="upload-btn">
                Upload Document
                <input type="file" id="fileUpload" accept=".txt,.md,.pdf" style="display:none;">
            </label>
            <div id="uploadStatus" style="font-size:0.8em;color:#8b949e;margin-top:6px;"></div>
        </div>
        
        <div class="sidebar-section" style="margin-top:auto;">
            <div class="conv-id">Session: <span id="convId">default</span></div>
        </div>
    </div>
    
    <div class="main">
        <div class="main-header">
            <span class="title" id="currentAgent">Coordinator Agent</span>
            <button class="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
        <div class="chat-container" id="chat"></div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
            <button id="send" onclick="sendMessage()">Send</button>
        </div>
    </div>
    
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        let currentAgent = 'coordinator';
        const convId = 'session-' + Date.now();
        document.getElementById('convId').textContent = convId.substring(0, 12);
        
        // Agent selection
        document.querySelectorAll('.agent-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.agent-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentAgent = item.dataset.agent;
                document.getElementById('currentAgent').textContent = item.textContent.trim() + ' Agent';
            });
        });
        
        // Load tools
        fetch('/api/tools').then(r => r.json()).then(tools => {
            const list = document.getElementById('toolList');
            list.innerHTML = tools.map(t => `<div class="tool-item"><span class="name">${t.name}</span><span>${t.description.substring(0, 20)}</span></div>`).join('');
        }).catch(() => {});
        
        // File upload
        document.getElementById('fileUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('uploadStatus');
            status.textContent = 'Uploading...';
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/rag/upload', { method: 'POST', body: formData });
                const data = await res.json();
                status.textContent = data.message || data.status;
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
            }
        });
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;
            input.value = '';
            sendBtn.disabled = true;
            
            addMessage('user', message);
            const assistantDiv = addMessage('assistant', '');
            const bubble = assistantDiv.querySelector('.bubble');
            bubble.classList.add('streaming');
            
            try {
                const response = await fetch('/api/chat/agent/' + currentAgent, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, conversationId: convId })
                });
                const data = await response.json();
                bubble.textContent = data.response || data.error || 'No response';
            } catch (error) {
                bubble.textContent = 'Error: ' + error.message;
            } finally {
                bubble.classList.remove('streaming');
                sendBtn.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        }
        
        async function clearHistory() {
            await fetch('/api/chat/history/' + convId, { method: 'DELETE' });
            chat.innerHTML = '';
        }
        
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="$1">$2</code></pre>');
            div.innerHTML = `<div class="bubble">${formatted}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
