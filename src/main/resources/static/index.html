<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 1.2em; color: #58a6ff; }
        .header .badge { background: rgba(63,185,80,0.15); color: #3fb950; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 16px; max-width: 80%; }
        .message.user { margin-left: auto; }
        .message .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
        .message.user .bubble { background: #1f6feb; }
        .message.assistant .bubble { background: #161b22; border: 1px solid #30363d; }
        .message.assistant .bubble.streaming::after { content: '▊'; animation: blink 1s infinite; }
        @keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
        .input-area { background: #161b22; border-top: 1px solid #30363d; padding: 16px 24px; display: flex; gap: 12px; }
        .input-area input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; color: #e6edf3; font-size: 1em; outline: none; }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button { background: #1f6feb; color: white; border: none; border-radius: 8px; padding: 12px 24px; cursor: pointer; font-size: 1em; }
        .input-area button:hover { background: #388bfd; }
        .input-area button:disabled { background: #21262d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Agent</h1>
        <span class="badge">DeepSeek V4 Pro</span>
    </div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
        <button id="send" onclick="sendMessage()">发送</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            sendBtn.disabled = true;

            addMessage('user', message);
            const assistantDiv = addMessage('assistant', '');
            const bubble = assistantDiv.querySelector('.bubble');
            bubble.classList.add('streaming');

            try {
                const response = await fetch('/api/chat/sse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value, { stream: true });
                    const lines = text.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const data = line.substring(5);
                            if (data === '[DONE]') break;
                            bubble.textContent += data;
                        }
                    }
                }
                bubble.classList.remove('streaming');
            } catch (error) {
                bubble.textContent = 'Error: ' + error.message;
                bubble.classList.remove('streaming');
            } finally {
                sendBtn.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
