<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - 多功能智能体</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f0f;
            --sidebar: #1a1a2e;
            --card: #16213e;
            --border: #233;
            --text: #e0e0e0;
            --text-dim: #888;
            --accent: #4a9eff;
            --accent-dim: #2a6ec0;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #fbbf24;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 18px; color: var(--accent); }
        .sidebar-header p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        .sidebar-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-section h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .model-select { width: 100%; padding: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
        .agent-list { display: flex; flex-direction: column; gap: 4px; }
        .agent-item { padding: 8px 12px; background: var(--card); border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .agent-item:hover { background: var(--accent-dim); }
        .agent-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
        .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

        .tool-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 8px; }
        .toggle-switch { position: relative; width: 36px; height: 20px; background: var(--border); border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .toggle-switch.on { background: var(--green); }
        .toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle-switch.on .toggle-knob { left: 18px; }

        /* Main chat area */
        .main { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 16px; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: var(--green); color: #000; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .msg.user { align-self: flex-end; background: var(--accent-dim); }
        .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
        .msg.tool-result { align-self: center; background: #1a3a1a; border: 1px solid var(--green); font-family: monospace; font-size: 12px; max-width: 90%; }
        .msg .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

        .chat-input { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
        .chat-input textarea { flex: 1; padding: 12px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: none; height: 44px; max-height: 120px; }
        .chat-input button { padding: 12px 24px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .chat-input button:hover { background: var(--accent-dim); }
        .chat-input button:disabled { background: var(--border); cursor: not-allowed; }

        /* Right panel - tools */
        .right-panel { width: 280px; background: var(--sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .right-panel h3 { padding: 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
        .tool-list { flex: 1; overflow-y: auto; padding: 8px; }
        .tool-card { padding: 12px; background: var(--card); border-radius: 6px; margin-bottom: 8px; }
        .tool-card .name { font-size: 13px; color: var(--accent); font-weight: 600; }
        .tool-card .desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .tool-test { margin-top: 8px; display: flex; gap: 4px; }
        .tool-test input { flex: 1; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
        .tool-test button { padding: 6px 12px; background: var(--accent-dim); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AI Agent</h1>
            <p>多功能智能体系统</p>
        </div>
        <div class="sidebar-section">
            <h3>模型选择</h3>
            <select class="model-select" id="modelSelect">
                <option value="deepseek-v4-flash">DeepSeek V4 Flash (低成本)</option>
                <option value="deepseek-v4-pro">DeepSeek V4 Pro (高性能)</option>
                <option value="deepseek-v4-flash-vision-exp">DeepSeek V4 Vision</option>
            </select>
            <div class="tool-toggle">
                <div class="toggle-switch" id="toolsToggle">
                    <div class="toggle-knob"></div>
                </div>
                <span>启用工具调用</span>
            </div>
        </div>
        <div class="sidebar-section">
            <h3>API Key (鉴权)</h3>
            <input class="model-select" id="apiKeyInput" type="password" placeholder="输入 X-API-Key">
        </div>
        <div class="sidebar-section">
            <h3>Agent 列表</h3>
            <div class="agent-list" id="agentList">
                <div class="agent-item active" data-agent="coordinator"><div class="agent-dot"></div>Coordinator</div>
                <div class="agent-item" data-agent="code"><div class="agent-dot"></div>Code Agent</div>
                <div class="agent-item" data-agent="research"><div class="agent-dot"></div>Research Agent</div>
                <div class="agent-item" data-agent="data"><div class="agent-dot"></div>Data Agent</div>
                <div class="agent-item" data-agent="react"><div class="agent-dot"></div>ReAct Agent</div>
            </div>
        </div>
        <div class="sidebar-section">
            <h3>对话</h3>
            <div class="agent-list">
                <div class="agent-item" id="newChatBtn"><div class="agent-dot" style="background:var(--accent)"></div>新对话</div>
                <div class="agent-item" id="clearChatBtn"><div class="agent-dot" style="background:var(--red)"></div>清空记录</div>
            </div>
        </div>
        <div class="sidebar-section" style="margin-top:auto">
            <h3>存储后端</h3>
            <div style="display:flex;flex-direction:column;gap:6px;font-size:12px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="color:var(--text-dim)">记忆</span>
                    <span id="memoryBackend" style="color:var(--yellow)">检测中...</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="color:var(--text-dim)">向量库</span>
                    <span id="vectorBackend" style="color:var(--yellow)">检测中...</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="color:var(--text-dim)">对话数</span>
                    <span id="convCount" style="color:var(--text)">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="chat-header">
            <h2 id="chatTitle">AI Agent</h2>
            <span class="status-badge" id="statusBadge">在线</span>
        </div>
        <div class="chat-messages" id="messages">
            <div class="msg assistant">
                <div class="meta">AI Agent</div>
                你好！我是多功能 AI Agent，可以聊天、搜索、查天气、读写文件等。选择左边的模型和工具来开始吧。
            </div>
        </div>
        <div class="chat-input">
            <textarea id="input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <div class="right-panel">
        <h3>工具面板</h3>
        <div class="tool-list" id="toolList"></div>
    </div>

    <script>
        let conversationId = 'session-' + Date.now();
        let selectedAgent = 'coordinator';
        let useTools = false;
        let selectedModel = 'deepseek-v4-flash';

        // API Key 管理：受保护接口需携带 X-API-Key 请求头
        const apiKeyInput = document.getElementById('apiKeyInput');
        apiKeyInput.value = localStorage.getItem('agentApiKey') || '';
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('agentApiKey', apiKeyInput.value.trim());
        });

        async function apiFetch(url, options = {}) {
            options.headers = Object.assign({}, options.headers, { 'X-API-Key': apiKeyInput.value.trim() });
            const res = await fetch(url, options);
            if (res.status === 401) {
                throw new Error('鉴权失败 (401)：请在左侧填入正确的 API Key');
            }
            return res;
        }

        // Model selector
        document.getElementById('modelSelect').addEventListener('change', e => {
            selectedModel = e.target.value;
        });

        // Tools toggle
        document.getElementById('toolsToggle').addEventListener('click', e => {
            useTools = !useTools;
            e.currentTarget.classList.toggle('on', useTools);
        });

        // Agent selection
        document.querySelectorAll('.agent-item[data-agent]').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.agent-item[data-agent]').forEach(a => a.classList.remove('active'));
                el.classList.add('active');
                selectedAgent = el.dataset.agent;
                document.getElementById('chatTitle').textContent = selectedAgent + ' Agent';
            });
        });

        // New chat
        document.getElementById('newChatBtn').addEventListener('click', () => {
            conversationId = 'session-' + Date.now();
            document.getElementById('messages').innerHTML = '';
            addMessage('assistant', '新对话已开始。');
        });

        // Clear chat
        document.getElementById('clearChatBtn').addEventListener('click', async () => {
            await apiFetch('/api/chat/history/' + conversationId, { method: 'DELETE' });
            document.getElementById('messages').innerHTML = '';
            addMessage('assistant', '对话记录已清空。');
        });

        // Input handling
        const input = document.getElementById('input');
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // Send message
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '思考中...';

            try {
                const endpoint = useTools ? '/api/chat/simple' : '/api/chat/agent/' + selectedAgent;
                const body = useTools
                    ? { message: text, conversationId, model: selectedModel, useTools: 'true' }
                    : { message: text, conversationId, model: selectedModel };

                const res = await apiFetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                addMessage('assistant', data.response || 'AI 返回空回复', data.model || selectedModel);
            } catch (err) {
                addMessage('assistant', '请求失败: ' + err.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        function addMessage(role, content, meta) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            let html = '';
            if (meta) html += '<div class="meta">' + meta + '</div>';
            html += (content || '空回复').replace(/\n/g, '<br>');
            div.innerHTML = html;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        // Load tools
        async function loadTools() {
            const res = await apiFetch('/api/chat/tools');
            const tools = await res.json();
            const list = document.getElementById('toolList');
            list.innerHTML = '';
            tools.forEach(t => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="name">${t.name}</div>
                    <div class="desc">${t.description}</div>
                    <div class="tool-test">
                        <input placeholder="输入参数..." data-tool="${t.name}">
                        <button onclick="testTool('${t.name}', this)">执行</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function testTool(name, btn) {
            const input = btn.previousElementSibling;
            const val = input.value.trim();
            if (!val) { alert('请输入参数'); return; }

            btn.textContent = '...';
            btn.disabled = true;
            try {
                const res = await apiFetch('/api/tools/' + name, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: val })
                });
                const data = await res.json();
                addMessage('tool-result', '🔧 ' + name + '("' + val + '"):\n' + data.result);
            } catch (err) {
                addMessage('tool-result', '执行失败: ' + err.message);
            } finally {
                btn.textContent = '执行';
                btn.disabled = false;
            }
        }

        loadTools();
        loadStorageStatus();

        async function loadStorageStatus() {
            try {
                const res = await apiFetch('/api/chat/storage-status');
                const data = await res.json();
                const memEl = document.getElementById('memoryBackend');
                const vecEl = document.getElementById('vectorBackend');
                const countEl = document.getElementById('convCount');

                const memType = data.memoryBackend;
                memEl.textContent = memType === 'redis' ? 'Redis' : 'InMemory';
                memEl.style.color = memType === 'redis' ? 'var(--green)' : 'var(--yellow)';

                const vecType = data.vectorStoreBackend;
                vecEl.textContent = vecType === 'qdrant' ? 'Qdrant' : 'InMemory';
                vecEl.style.color = vecType === 'qdrant' ? 'var(--green)' : 'var(--yellow)';

                countEl.textContent = data.conversations || 0;
            } catch (err) {
                console.error('Storage status fetch failed:', err);
            }
        }
    </script>
</body>
</html>
